[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harite"
version = "0.1.2"
description = "Harite wallpaper optimizer (refactor of wallpaperoptimizer)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
    "Pillow>=10.0",
]

[project.scripts]
harite = "harite.cli:run"
harite-gui = "harite.gui.app:run"
