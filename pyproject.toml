[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harite"
version = "2.0.1"
description = "Harite wallpaper optimizer (refactor of wallpaperoptimizer)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
    "click>=8.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
gui-qt = ["PyQt6>=6.4"]

[project.scripts]
harite = "harite.cli:run"
harite-gui = "harite.gui.app_qt:run"
harite-qt = "harite.gui.app_qt:run"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
"harite.gui" = ["resources/**/*"]
