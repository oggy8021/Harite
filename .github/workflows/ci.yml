name: CI

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  actions: write

jobs:
  changes:
    name: Detect code changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect non-doc changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'pytest.ini'
              - 'setup.cfg'
              - 'setup.py'
              - '.github/**'
              - 'scripts/**'

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check src tests || true

  test:
    name: Test matrix
    runs-on: ${{ matrix.os }}
    needs: [changes]
    if: >
      always() && (
        github.event_name != 'pull_request' ||
        needs.changes.result == 'skipped' ||
        needs.changes.outputs.code == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: [3.12]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install Qt system libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon0

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui-qt]"
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  test-skipped:
    name: Test matrix
    needs: [changes]
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: [3.12]
    steps:
      - name: Skip tests for docs-only PR
        run: echo "Docs-only PR; skipping pytest (ubuntu matrix satisfied)."

  build-dist:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    needs: [test, test-skipped]
    if: always() && (needs.test.result == 'success' || needs.test-skipped.result == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --sdist --wheel

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-dist
          path: dist/*
