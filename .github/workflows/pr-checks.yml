name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    # ignore pushes to main to avoid blocking merges
    branches-ignore: [ main ]

permissions:
  contents: read

jobs:
  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate branch name
        shell: bash
        run: |
          set -euo pipefail
          # For PRs GITHUB_HEAD_REF is set; for direct pushes fall back to ref name
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Branch: $BRANCH"
          # Skip automated checks for backup branches (e.g. save/*)
          if [[ "$BRANCH" =~ ^save\/ ]]; then
            echo "Skipping PR Checks for backup branch: $BRANCH"
            exit 0
          fi
          if [[ ! "$BRANCH" =~ ^(feature|fix|docs|chore)\/[a-z0-9_.-]+$ ]]; then
            echo "::error ::Branch name '$BRANCH' does not match required pattern 'feature|fix|docs|chore/<name>'"
            echo "Suggested pattern: feature/my-feature"
            exit 1
          fi

  validate-pr-body:
    name: Validate PR body
    if: ${{ github.event_name == 'pull_request' }}
    needs: validate-branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR body content
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          # Reject empty or whitespace-only PR bodies.
          if [[ -z "${BODY//[[:space:]]/}" ]]; then
            echo "::error ::Pull request body is empty. Please fill the PR template sections (概要 / 変更内容 / テスト手順)."
            exit 1
          fi
          echo "PR body present."
