name: Docs diff size check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'

jobs:
  check_diff:
    name: Check docs replacement diff size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
          uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run apply_docs_replacements (dry-run)
        run: |
          python scripts/apply_docs_replacements.py --dry-run --report docs/replacements-report-ci.md || true

      - name: Count diff lines and fail if too large
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/replacements-report-ci.md')
          if not p.exists():
              print('No report found; passing')
              raise SystemExit(0)
          s = p.read_text(encoding='utf-8')
          count = 0
          for line in s.splitlines():
              if line.startswith('+') and not line.startswith('+++'):
                  count += 1
              if line.startswith('-') and not line.startswith('---'):
                  count += 1
          print(f'Diff changed lines: {count}')
          MAX = 300
          if count > MAX:
              print(f'Exceeded max allowed diff lines: {count} > {MAX}')
              raise SystemExit(1)
          PY
