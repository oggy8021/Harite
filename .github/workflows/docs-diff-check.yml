name: Docs diff size check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'

jobs:
  check_diff:
    name: Check docs replacement diff size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run apply_docs_replacements (dry-run)
        run: |
          python scripts/apply_docs_replacements.py --dry-run --report docs/replacements-report-ci.md || true

      - name: Count diff lines per file and fail if too large
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/replacements-report-ci.md')
          if not p.exists():
              print('No report found; passing')
              raise SystemExit(0)
          s = p.read_text(encoding='utf-8')
          per_file = {}
          current = None
          for line in s.splitlines():
            if line.startswith('## '):
              current = line[3:].strip()
              per_file[current] = 0
              continue
            if current is None:
              continue
            if line.startswith('+') and not line.startswith('+++'):
              per_file[current] += 1
            if line.startswith('-') and not line.startswith('---'):
              per_file[current] += 1

          if not per_file:
            print('No replacement diff entries found; passing')
            raise SystemExit(0)

          MAX_PER_FILE = 100
          print('Replacement diff lines per file:')
          for path, count in sorted(per_file.items(), key=lambda item: item[1], reverse=True):
            print(f'  {count:>4}  {path}')

          offenders = [(path, count) for path, count in per_file.items() if count > MAX_PER_FILE]
          if offenders:
            print(f'Exceeded max allowed diff lines in a single file: > {MAX_PER_FILE}')
            for path, count in sorted(offenders, key=lambda item: item[1], reverse=True):
              print(f'  offender: {count:>4}  {path}')
            raise SystemExit(1)
          PY
